name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: semestra_test
          POSTGRES_USER: semestra
          POSTGRES_PASSWORD: semestra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semestra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: semestra_test
      DB_USERNAME: semestra
      DB_PASSWORD: semestra
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, bcmath, pcntl
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan migrate --force
      # Runs everything under tests/, including tests/Unit/Engine — the
      # planning-engine fixture suite. That suite must never be skipped
      # or excluded from this run; it's the plan's actual correctness gate.
      - run: php artisan test
