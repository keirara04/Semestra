# Local dev only — not used for production (see .do/app.yaml for that).
# Copy backend/.env.example -> backend/.env and frontend/.env.local.example
# -> frontend/.env.local first; DB_HOST/REDIS_HOST in backend/.env should
# be "postgres" / "redis" (the service names below), not 127.0.0.1.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --tries=3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: semestra
      POSTGRES_USER: semestra
      POSTGRES_PASSWORD: semestra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semestra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next_cache:
  backend_vendor:
