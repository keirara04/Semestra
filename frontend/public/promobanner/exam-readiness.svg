    <text x="0" y="143" fill="#a9b1bb" font-family="Arial, Helvetica, sans-serif" font-size="16">Make revision feel finite—with a next</text><text x="0" y="166" fill="#a9b1bb" font-family="Arial, Helvetica, sans-serif" font-size="16">study block that is always clear.</text>
