<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra semester map banner in the dashboard UI theme</title>
  <desc id="desc">A dark Semestra-style promo banner with a timeline of academic milestones.</desc>
  <defs><pattern id="dots" width="20" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.25" fill="#69717b" fill-opacity=".63"/></pattern></defs>
  <rect width="1600" height="360" fill="#111315"/><rect y="6" width="1600" height="6" fill="url(#dots)"/><rect y="348" width="1600" height="6" fill="url(#dots)"/><path d="M0 17H1600M0 343H1600" stroke="#24292e"/>
  <g fill="none" stroke="#59616a" stroke-width="1.3" opacity=".7"><path d="M35 48h17M43.5 39.5v17M35 312h17M43.5 303.5v17M748 48h17M756.5 39.5v17M748 312h17M756.5 303.5v17"/></g><path d="M782 37V323" stroke="#2a3035"/>
  <g transform="translate(70 66)">
    <text x="0" y="0" fill="#d17056" font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="2.2">SEMESTRA · TERM VIEW</text>
    <text x="0" y="58" fill="#e7e4dc" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.7">Your semester,</text>
    <text x="0" y="104" fill="#e7e4dc" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.7">held together.</text>
    <text x="0" y="143" fill="#a9b1bb" font-family="Arial, Helvetica, sans-serif" font-size="16">One calm place for every course,</text><text x="0" y="166" fill="#a9b1bb" font-family="Arial, Helvetica, sans-serif" font-size="16">deadline, and turning point in the term.</text>
    <path d="M0 194h62" stroke="#d17056" stroke-width="3"/>
    <g transform="translate(0 205)" font-family="Courier New, monospace" font-size="11">
      <text x="0" y="0" fill="#7f8995" letter-spacing="1.6">01</text><text x="48" y="0" fill="#d7d6cf" letter-spacing="1.4">COURSES</text><text x="377" y="0" fill="#d17056" letter-spacing="1.3">ORGANIZED</text><path d="M0 19h444" stroke="#2b3137"/>
      <text x="0" y="42" fill="#7f8995" letter-spacing="1.6">02</text><text x="48" y="42" fill="#d7d6cf" letter-spacing="1.4">KEY DATES</text><text x="391" y="42" fill="#d17056" letter-spacing="1.3">SEEN</text>
    </g>
  </g>
  <text x="70" y="340" fill="#7f8995" font-family="Courier New, monospace" font-size="10.5" letter-spacing="1.5">SMST · FALL 2026</text>
  <g transform="translate(812 41)">
    <rect width="718" height="278" rx="8" fill="#1a1e22" stroke="#353b41" stroke-width="1.3"/><path d="M0 48H718" stroke="#353b41"/>
    <g transform="translate(24 29)" font-family="Courier New, monospace" font-size="10.5" font-weight="700" letter-spacing="1.6"><text x="0" y="0" fill="#e1dfd8">SEMESTER MAP / FALL 2026</text><text x="575" y="0" fill="#d17056">WEEK 03</text></g>
    <g transform="translate(28 82)">
      <g fill="#84909c" font-family="Courier New, monospace" font-size="10" letter-spacing="1.2"><text x="0" y="0">AUG 18</text><text x="131" y="0">SEP 01</text><text x="262" y="0">SEP 15</text><text x="393" y="0">SEP 29</text><text x="524" y="0">OCT 13</text></g>
      <path d="M9 32H622" stroke="#495159" stroke-width="2"/><g fill="#6e7884"><circle cx="9" cy="32" r="5"/><circle cx="140" cy="32" r="5"/><circle cx="271" cy="32" r="5"/><circle cx="402" cy="32" r="5"/><circle cx="533" cy="32" r="5"/></g><circle cx="140" cy="32" r="9" fill="none" stroke="#d17056" stroke-width="2"/>
      <g font-family="Courier New, monospace" font-size="9.5" letter-spacing=".7"><text x="0" y="56" fill="#c8c9c4">TERM START</text><text x="101" y="56" fill="#d17056">LAB REPORT</text><text x="236" y="56" fill="#c8c9c4">MIDTERM</text><text x="362" y="56" fill="#c8c9c4">CRITIQUE</text><text x="494" y="56" fill="#c8c9c4">ESSAY DUE</text></g>
    </g>
    <g transform="translate(24 159)" font-family="Courier New, monospace">
      <text x="0" y="0" fill="#84909c" font-size="10" letter-spacing="1.4">UP NEXT</text>
      <g transform="translate(0 17)"><rect width="670" height="30" rx="4" fill="#22272c"/><text x="14" y="20" fill="#d7d6cf" font-size="11" letter-spacing="1.1">CS204 · LAB REPORT</text><text x="490" y="20" fill="#8b96a2" font-size="10">03 SEP</text><text x="598" y="20" fill="#d17056" font-size="10">3 DAYS</text></g>
      <g transform="translate(0 54)"><rect width="670" height="30" rx="4" fill="#1e2328" stroke="#30363c"/><text x="14" y="20" fill="#d7d6cf" font-size="11" letter-spacing="1.1">MTH201 · PROBLEM SET 02</text><text x="490" y="20" fill="#8b96a2" font-size="10">10 SEP</text><text x="590" y="20" fill="#8b96a2" font-size="10">10 DAYS</text></g>
      <g transform="translate(0 91)"><rect width="670" height="30" rx="4" fill="#1e2328" stroke="#30363c"/><text x="14" y="20" fill="#d7d6cf" font-size="11" letter-spacing="1.1">DES102 · CRITIQUE</text><text x="490" y="20" fill="#8b96a2" font-size="10">17 SEP</text><text x="590" y="20" fill="#8b96a2" font-size="10">17 DAYS</text></g>
    </g>
  </g>
</svg>
