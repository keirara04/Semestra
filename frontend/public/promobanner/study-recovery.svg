<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra study recovery banner</title>
  <desc id="desc">A dark interface banner for rebuilding a study plan.</desc>
  <rect width="1600" height="360" fill="#111315"/>
  <path d="M0 12H1600M0 348H1600" stroke="#34393F" stroke-width="1" stroke-dasharray="1 18" stroke-linecap="round"/>
  <g stroke="#34393F" stroke-width="1.5"><path d="M30 40h18m-9-9v18M1570 40h-18m9-9v18M30 320h18m-9 9v-18M1570 320h-18m9 9v-18"/></g>
  <g font-family="Courier New, Courier, monospace" letter-spacing="2.2" fill="#8A94A1" font-size="11">
    <text x="88" y="63" fill="#D17056">SEMESTRA · STUDENT COPILOT</text>
    <text x="88" y="305">PLAN EARLY. MISS NOTHING.</text>
    <text x="672" y="305">SMST · REG</text>
  </g>
  <text x="88" y="130" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#E7E4DC">Recover your week.</text>
  <rect x="88" y="151" width="62" height="3" fill="#D17056"/>
  <text x="88" y="185" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#B9B9B4">Turn missed sessions into a realistic plan</text>
  <text x="88" y="209" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#B9B9B4">that fits the time you still have.</text>
  <g font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="1.3">
    <text x="88" y="258" fill="#8A94A1">01</text><text x="132" y="258" fill="#E7E4DC">MISSED BLOCKS</text><text x="413" y="258" fill="#D17056">RECOVERED</text>
    <path d="M88 272H540" stroke="#34393F"/>
    <text x="88" y="289" fill="#8A94A1">02</text><text x="132" y="289" fill="#E7E4DC">NEW ROUTINE</text><text x="454" y="289" fill="#D17056">READY</text>
  </g>
  <g transform="translate(890 58)">
    <rect width="620" height="244" rx="8" fill="#1B1F23" stroke="#34393F" stroke-width="1.5"/>
    <g font-family="Courier New, Courier, monospace" font-size="11" letter-spacing="1.7"><text x="28" y="31" fill="#8A94A1">RECOVERY QUEUE</text><text x="523" y="31" fill="#D17056">06:40 HRS</text></g>
    <path d="M0 48H620M28 104H592M28 156H592M28 208H592" stroke="#34393F"/>
    <g font-family="Courier New, Courier, monospace" font-size="13" letter-spacing=".7">
      <text x="28" y="79" fill="#8A94A1">MON</text><text x="89" y="79" fill="#E7E4DC">ECON 102 · CHAPTER 04</text><text x="503" y="79" fill="#D17056">+ 90M</text>
      <text x="28" y="131" fill="#8A94A1">TUE</text><text x="89" y="131" fill="#E7E4DC">CALC I · PROBLEM SET</text><text x="503" y="131" fill="#D17056">+ 75M</text>
      <text x="28" y="183" fill="#8A94A1">WED</text><text x="89" y="183" fill="#E7E4DC">HIST 210 · READING</text><text x="503" y="183" fill="#D17056">+ 60M</text>
    </g>
    <rect x="28" y="221" width="564" height="1" fill="#34393F"/>
    <text x="28" y="238" font-family="Courier New, Courier, monospace" font-size="10" letter-spacing="1.4" fill="#8A94A1">LOAD REBALANCED</text>
    <text x="486" y="238" font-family="Courier New, Courier, monospace" font-size="10" letter-spacing="1.4" fill="#D17056">APPLY PLAN →</text>
  </g>
