<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra workload forecast banner in the dashboard UI theme</title>
  <desc id="desc">A dark Semestra-style promo banner with workload copy and a bordered weekly capacity dashboard.</desc>
  <defs>
    <pattern id="dots" width="20" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.25" fill="#69717b" fill-opacity=".63"/></pattern>
  </defs>
  <rect width="1600" height="360" fill="#111315"/>
  <rect y="6" width="1600" height="6" fill="url(#dots)"/>
  <rect y="348" width="1600" height="6" fill="url(#dots)"/>
  <path d="M0 17H1600M0 343H1600" stroke="#24292e"/>
  <g fill="none" stroke="#59616a" stroke-width="1.3" opacity=".7">
    <path d="M35 48h17M43.5 39.5v17M35 312h17M43.5 303.5v17M748 48h17M756.5 39.5v17M748 312h17M756.5 303.5v17"/>
  </g>
  <path d="M782 37V323" stroke="#2a3035"/>

  <g transform="translate(70 66)">
    <text x="0" y="0" fill="#d17056" font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="2.2">SEMESTRA · STUDENT COPILOT</text>
    <text x="0" y="58" fill="#e7e4dc" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.7">Plan the week before</text>
    <text x="0" y="104" fill="#e7e4dc" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.7">it plans you.</text>
    <text x="0" y="143" fill="#a9b1bb" font-family="Arial, Helvetica, sans-serif" font-size="16">A clear reading of your study load,</text>
    <text x="0" y="166" fill="#a9b1bb" font-family="Arial, Helvetica, sans-serif" font-size="16">with room to make the week work.</text>
    <path d="M0 194h62" stroke="#d17056" stroke-width="3"/>
    <g transform="translate(0 224)">
      <text x="0" y="0" fill="#7f8995" font-family="Courier New, monospace" font-size="11" letter-spacing="1.6">01</text>
      <text x="48" y="0" fill="#d7d6cf" font-family="Courier New, monospace" font-size="11" letter-spacing="1.4">WEEKLY LOAD</text>
      <text x="384" y="0" fill="#d17056" font-family="Courier New, monospace" font-size="11" letter-spacing="1.3">VISIBLE</text>
      <path d="M0 19h444" stroke="#2b3137"/>
      <text x="0" y="42" fill="#7f8995" font-family="Courier New, monospace" font-size="11" letter-spacing="1.6">02</text>
      <text x="48" y="42" fill="#d7d6cf" font-family="Courier New, monospace" font-size="11" letter-spacing="1.4">CAPACITY</text>
      <text x="380" y="42" fill="#d17056" font-family="Courier New, monospace" font-size="11" letter-spacing="1.3">PROTECTED</text>
    </g>
  </g>
  <text x="70" y="323" fill="#7f8995" font-family="Courier New, monospace" font-size="10.5" letter-spacing="1.5">SMST · WEEK 03</text>

  <g transform="translate(812 41)">
    <rect width="718" height="278" rx="8" fill="#1a1e22" stroke="#353b41" stroke-width="1.3"/>
    <path d="M0 48H718" stroke="#353b41"/>
    <g transform="translate(24 29)" font-family="Courier New, monospace" font-size="10.5" font-weight="700" letter-spacing="1.6">
      <text x="0" y="0" fill="#e1dfd8">WEEKLY LOAD / WEEK 03</text>
      <text x="568" y="0" fill="#d17056">19H 45M PLANNED</text>
    </g>
    <g transform="translate(24 75)">
      <text x="0" y="0" fill="#84909c" font-family="Courier New, monospace" font-size="10" letter-spacing="1.4">DAY</text>
      <text x="89" y="0" fill="#84909c" font-family="Courier New, monospace" font-size="10" letter-spacing="1.4">LOAD</text>
      <text x="547" y="0" fill="#84909c" font-family="Courier New, monospace" font-size="10" letter-spacing="1.4">STATUS</text>
      <path d="M0 16h670" stroke="#32383e"/>
      <g font-family="Courier New, monospace" font-size="11">
        <text x="0" y="44" fill="#d7d6cf">MON</text><rect x="88" y="34" width="338" height="8" rx="4" fill="#30363c"/><rect x="88" y="34" width="141" height="8" rx="4" fill="#73808d"/><text x="548" y="44" fill="#8d98a4">OPEN</text>
        <text x="0" y="77" fill="#d7d6cf">TUE</text><rect x="88" y="67" width="338" height="8" rx="4" fill="#30363c"/><rect x="88" y="67" width="202" height="8" rx="4" fill="#73808d"/><text x="548" y="77" fill="#8d98a4">STEADY</text>
        <rect x="-12" y="88" width="682" height="34" rx="4" fill="#22272c"/>
        <text x="0" y="110" fill="#e7e4dc">WED</text><rect x="88" y="100" width="338" height="8" rx="4" fill="#30363c"/><rect x="88" y="100" width="318" height="8" rx="4" fill="#d17056"/><text x="548" y="110" fill="#d17056">HEAVY</text>
        <text x="0" y="143" fill="#d7d6cf">THU</text><rect x="88" y="133" width="338" height="8" rx="4" fill="#30363c"/><rect x="88" y="133" width="185" height="8" rx="4" fill="#73808d"/><text x="548" y="143" fill="#8d98a4">STEADY</text>
        <text x="0" y="176" fill="#d7d6cf">FRI</text><rect x="88" y="166" width="338" height="8" rx="4" fill="#30363c"/><rect x="88" y="166" width="89" height="8" rx="4" fill="#73808d"/><text x="548" y="176" fill="#8d98a4">OPEN</text>
      </g>
    </g>
    <g transform="translate(24 236)">
      <path d="M0 0h670" stroke="#353b41"/>
      <text x="0" y="23" fill="#8c97a3" font-family="Courier New, monospace" font-size="10" letter-spacing="1.2">RECOMMENDATION</text>
      <text x="145" y="23" fill="#e0dfd8" font-family="Arial, Helvetica, sans-serif" font-size="12.5">Move 1h 30m from Wednesday to Tuesday.</text>
      <text x="618" y="23" fill="#d17056" font-family="Courier New, monospace" font-size="10" font-weight="700">ADJUST →</text>
    </g>
  </g>
</svg>
