<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Semester week axis</title>
  <desc id="desc">A 12-week semester axis grouped into June, July, and August, followed by exams.</desc>
  <g stroke="#AEB5BB" stroke-width="1">
    <path d="M0 28H1200M0 62H1200"/>
    <path d="M0 28V62M100 28V62M200 28V62M300 28V62M400 28V62M500 28V62M600 28V62M700 28V62M800 28V62M900 28V62M1000 28V62M1100 28V62M1200 28V62" opacity=".7"/>
    <path d="M0 62V82M400 62V82M800 62V82M1100 62V82M1200 62V82" opacity=".8"/>
  </g>
  <g fill="#222933" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
    <text x="50" y="49">W1</text><text x="150" y="49">W2</text><text x="250" y="49">W3</text><text x="350" y="49">W4</text>
    <text x="450" y="49">W5</text><text x="550" y="49">W6</text><text x="650" y="49">W7</text><text x="750" y="49">W8</text>
    <text x="850" y="49">W9</text><text x="950" y="49">W10</text><text x="1050" y="49">W11</text><text x="1150" y="49">W12</text>
  </g>
  <g fill="#68707B" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.3" text-anchor="middle">
    <text x="200" y="82">JUN</text><text x="600" y="82">JUL</text><text x="950" y="82">AUG</text><text x="1150" y="82">EXAMS</text>
  </g>
</svg>
