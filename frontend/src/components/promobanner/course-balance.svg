<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra Course Balance promotional banner</title>
  <desc id="desc">A dark academic banner with left-aligned course balance copy and a right-side workload distribution dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151713"/><stop offset=".55" stop-color="#1D201A"/><stop offset="1" stop-color="#151713"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#C69B58" stop-opacity=".18"/><stop offset="1" stop-color="#C69B58" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#090B08" flood-opacity=".55"/></filter>
    <style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.tiny{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12px;letter-spacing:1.5px}.label{font-size:13px;letter-spacing:.35px}.muted{fill:#B9BDAF}.ink{fill:#F4ECDA}</style>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <circle cx="1263" cy="188" r="292" fill="url(#orb)"/>
  <path d="M0 0h500l-85 360H0Z" fill="#10120E" opacity=".42"/>
  <g opacity=".3" fill="none" stroke="#B9BDAF"><circle cx="1544" cy="40" r="76"/><circle cx="1544" cy="40" r="108"/><path d="M1402 320h138M1445 327h95"/></g>
  <g class="sans">
    <text x="60" y="84" class="tiny" fill="#C69B58">SEMESTRA / LOAD CHECK</text>
    <text x="60" y="143" class="serif ink" font-size="44" font-weight="700">Balance the work,</text>
    <text x="60" y="192" class="serif ink" font-size="44" font-weight="700">not just the grades.</text>
    <text x="60" y="229" class="label muted">See where your energy is going before the week gets away.</text>
    <g transform="translate(60 261)">
      <rect width="181" height="39" rx="19.5" fill="#C69B58"/>
      <text x="19" y="25" font-size="13" font-weight="700" fill="#151713">CHECK MY LOAD</text>
      <path d="M150 16h12m-5-5 5 5-5 5" fill="none" stroke="#151713" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="259" y="286" class="tiny" fill="#B9BDAF">07 / 08</text>
  </g>
  <g transform="translate(821 39)" filter="url(#shadow)" class="sans">
    <rect width="700" height="281" rx="18" fill="#22251E" stroke="#4A5040"/>
    <rect width="700" height="48" rx="18" fill="#2B3027"/>
    <path d="M0 48h700" stroke="#4A5040"/>
    <circle cx="25" cy="24" r="5" fill="#D47745"/><circle cx="43" cy="24" r="5" fill="#C69B58"/><circle cx="61" cy="24" r="5" fill="#78997A"/>
    <text x="91" y="29" font-size="13" font-weight="650" fill="#F4ECDA">Course balance</text>
    <text x="598" y="29" class="tiny" fill="#B9BDAF">AUG 12 — 18</text>
    <g transform="translate(28 74)">
      <text class="tiny" fill="#B9BDAF">WEEKLY LOAD</text>
      <g transform="translate(0 29)">
        <path d="M74 0A74 74 0 1 1 10 38" fill="none" stroke="#46503F" stroke-width="18" stroke-linecap="round"/>
        <path d="M10 38A74 74 0 0 1 79 0" fill="none" stroke="#78997A" stroke-width="18" stroke-linecap="round"/>
        <path d="M86 1A74 74 0 0 1 144 86" fill="none" stroke="#6E8DB7" stroke-width="18" stroke-linecap="round"/>
        <path d="M139 101A74 74 0 0 1 91 145" fill="none" stroke="#C69B58" stroke-width="18" stroke-linecap="round"/>
        <text x="74" y="67" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#F4ECDA">82%</text>
        <text x="74" y="88" text-anchor="middle" font-size="11" fill="#B9BDAF">balanced</text>
      </g>
      <text x="8" y="191" font-size="12" fill="#B9BDAF">Your workload is sustainable.</text>
    </g>
    <g transform="translate(222 75)">
      <text class="tiny" fill="#B9BDAF">BY COURSE</text>
      <g transform="translate(0 31)">
        <text y="11" font-size="12" fill="#F4ECDA">ECON 201</text><rect x="95" y="1" width="232" height="10" rx="5" fill="#46503F"/><rect x="95" y="1" width="167" height="10" rx="5" fill="#78997A"/><text x="342" y="11" font-size="12" fill="#78997A">6h</text>
        <text y="48" font-size="12" fill="#F4ECDA">PSYC 114</text><rect x="95" y="38" width="232" height="10" rx="5" fill="#46503F"/><rect x="95" y="38" width="115" height="10" rx="5" fill="#6E8DB7"/><text x="342" y="48" font-size="12" fill="#6E8DB7">4h</text>
        <text y="85" font-size="12" fill="#F4ECDA">MATH 127</text><rect x="95" y="75" width="232" height="10" rx="5" fill="#46503F"/><rect x="95" y="75" width="196" height="10" rx="5" fill="#C69B58"/><text x="342" y="85" font-size="12" fill="#C69B58">7h</text>
        <text y="122" font-size="12" fill="#F4ECDA">HIST 102</text><rect x="95" y="112" width="232" height="10" rx="5" fill="#46503F"/><rect x="95" y="112" width="83" height="10" rx="5" fill="#D47745"/><text x="342" y="122" font-size="12" fill="#D47745">3h</text>
      </g>
      <rect y="180" width="376" height="1" fill="#4A5040"/>
      <circle cy="206" r="5" fill="#C69B58"/><text x="13" y="210" font-size="12" fill="#D9D8C9">MATH 127 is your heaviest course</text>
    </g>
  </g>
</svg>
