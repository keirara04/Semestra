<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra Deadline Radar</title>
  <desc id="desc">A dark academic promotional banner showing an upcoming deadline radar dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151713"/><stop offset="1" stop-color="#1d201a"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292b24"/><stop offset="1" stop-color="#1d201a"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d47745"/><stop offset="1" stop-color="#c69b58"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#03040A" flood-opacity=".5"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9bdaf" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1600" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1335" cy="34" r="270" fill="#78997a" opacity=".09"/>
  <circle cx="1510" cy="290" r="210" fill="#c69b58" opacity=".06"/>
  <g opacity=".35"><path d="M0 310C160 244 260 388 449 310S734 258 849 340" fill="none" stroke="#78997a" stroke-width="1"/><path d="M0 326C181 262 281 402 471 326S728 279 862 350" fill="none" stroke="#78997a" stroke-width="1"/></g>
  <g transform="translate(76 61)">
    <g font-family="Georgia, 'Times New Roman', serif">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#d47745" fill-opacity=".13" stroke="#d47745" stroke-opacity=".48"/>
      <circle cx="18" cy="15" r="4" fill="#d47745"/><text x="31" y="19" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#f4ecda" letter-spacing="1.15">PLAN AHEAD</text>
      <text x="0" y="91" font-size="43" font-weight="750" letter-spacing="-1.6" fill="#f4ecda">Never lose a deadline</text>
      <text x="0" y="124" font-size="43" font-weight="750" letter-spacing="-1.6" fill="#f4ecda">to the noise.</text>
      <text x="0" y="169" font-size="16" fill="#b9bdaf">Deadline Radar puts every due date in one quiet,</text>
      <text x="0" y="193" font-size="16" fill="#b9bdaf">prioritized view — with just enough urgency.</text>
      <g transform="translate(0 221)"><rect width="151" height="43" rx="12" fill="url(#glow)"/><text x="18" y="27" font-size="14" font-weight="700" fill="#151713">Open Radar</text><path d="M119 17l7 5-7 5M126 22h-17" fill="none" stroke="#151713" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>
  </g>
  <g transform="translate(891 35)" font-family="Georgia, 'Times New Roman', serif" filter="url(#shadow)">
    <rect width="625" height="290" rx="20" fill="#1d201a" stroke="#697060" stroke-opacity=".56"/>
    <rect x="1" y="1" width="623" height="43" rx="19" fill="#292b24"/><path d="M1 43h623" stroke="#697060" stroke-opacity=".45"/>
    <circle cx="25" cy="22" r="5" fill="#d47745"/><circle cx="43" cy="22" r="5" fill="#c69b58"/><circle cx="61" cy="22" r="5" fill="#78997a"/>
    <text x="91" y="27" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#f4ecda">DEADLINE RADAR</text>
    <rect x="28" y="67" width="214" height="192" rx="14" fill="url(#card)" stroke="#697060" stroke-opacity=".46"/>
    <text x="48" y="94" font-size="12" font-weight="700" fill="#f4ecda">This week</text><text x="48" y="115" font-size="11" fill="#b9bdaf">Sorted by urgency</text>
    <g transform="translate(48 133)"><circle cx="7" cy="7" r="7" fill="#d47745"/><text x="25" y="5" font-size="11" font-weight="700" fill="#f4ecda">Psychology essay</text><text x="25" y="21" font-size="10" fill="#e3a17c">Tomorrow · 11:59 PM</text></g>
    <path d="M48 169h174" stroke="#4e5448"/>
    <g transform="translate(48 183)"><circle cx="7" cy="7" r="7" fill="#c69b58"/><text x="25" y="5" font-size="11" font-weight="700" fill="#f4ecda">Calculus problem set</text><text x="25" y="21" font-size="10" fill="#c69b58">Wed · 2 days</text></g>
    <path d="M48 219h174" stroke="#4e5448"/>
    <g transform="translate(48 233)"><circle cx="7" cy="7" r="7" fill="#78997a"/><text x="25" y="5" font-size="11" font-weight="700" fill="#f4ecda">Lab reflection</text></g>
    <g transform="translate(282 66)"><text x="0" y="15" font-size="12" font-weight="700" fill="#f4ecda">Urgency pulse</text><text x="0" y="34" font-size="11" fill="#b9bdaf">Your next 14 days</text>
      <g transform="translate(160 80)"><circle cx="85" cy="85" r="84" fill="none" stroke="#454a40" stroke-width="1"/><circle cx="85" cy="85" r="57" fill="none" stroke="#555b4e" stroke-width="1"/><circle cx="85" cy="85" r="30" fill="none" stroke="#697060" stroke-width="1"/><path d="M85 1V169M1 85H169M25 25l120 120M145 25L25 145" stroke="#555b4e" stroke-width="1"/>
      <path d="M85 85L137 45" stroke="#d47745" stroke-width="2"/><circle cx="137" cy="45" r="9" fill="#d47745"/><circle cx="85" cy="85" r="6" fill="#f4ecda"/><path d="M85 85L51 128" stroke="#78997a" stroke-width="2"/><circle cx="51" cy="128" r="7" fill="#78997a"/>
      <rect x="101" y="0" width="72" height="24" rx="12" fill="#3a3025"/><text x="113" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#f1cfb9">2 critical</text></g>
      <g transform="translate(0 228)"><rect width="314" height="31" rx="10" fill="#292b24"/><circle cx="18" cy="15.5" r="5" fill="#d47745"/><text x="32" y="19" font-size="11" fill="#b9bdaf">Your workload is <tspan font-weight="700" fill="#c69b58">spiking Thursday</tspan></text></g>
    </g>
  </g>
</svg>
