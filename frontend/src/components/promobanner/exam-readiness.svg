<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra exam readiness promotional banner</title>
  <desc id="desc">Dark academic banner showing an exam preparation dashboard with readiness rings and a study plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171814"/><stop offset="1" stop-color="#0e0f0d"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#282a24"/><stop offset="1" stop-color="#1a1c18"/></linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <g stroke="#f3ecda" stroke-opacity=".05" stroke-width="1">
    <path d="M0 60H1600M0 120H1600M0 180H1600M0 240H1600M0 300H1600"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360M1200 0V360M1280 0V360M1360 0V360M1440 0V360M1520 0V360"/>
  </g>
  <circle cx="1187" cy="168" r="175" fill="#c69b58" fill-opacity=".06" filter="url(#glow)"/>
  <path d="M714 36V324" stroke="#d47745" stroke-opacity=".48"/>
  <path d="M746 36V324" stroke="#f3ecdd" stroke-opacity=".12"/>

  <text x="72" y="76" fill="#e58854" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2">SEMESTRA / EXAM PREP</text>
  <text x="72" y="137" fill="#f4ecda" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="700">Know what needs</text>
  <text x="72" y="185" fill="#f4ecda" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="700">your attention.</text>
  <text x="72" y="231" fill="#b9bdaf" font-family="Arial, Helvetica, sans-serif" font-size="17">Turn every exam into a focused revision plan—</text>
  <text x="72" y="255" fill="#b9bdaf" font-family="Arial, Helvetica, sans-serif" font-size="17">with the next best study move made obvious.</text>
  <g transform="translate(72 291)">
    <rect width="205" height="34" rx="17" fill="#e48650"/>
    <text x="18" y="22" fill="#141512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" letter-spacing="1.3">CHECK READINESS</text>
    <path d="M179 12l8 5-8 5" fill="none" stroke="#141512" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(805 38)">
    <rect width="724" height="284" rx="18" fill="url(#panel)" stroke="#626956" stroke-opacity=".72"/>
    <rect x="1" y="1" width="722" height="45" rx="17" fill="#2d3229" fill-opacity=".8"/>
    <path d="M1 46H723" stroke="#676f5c" stroke-opacity=".6"/>
    <text x="28" y="29" fill="#f1eadb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.6">EXAM READINESS</text>
    <rect x="600" y="12" width="95" height="22" rx="11" fill="#563227"/>
    <text x="615" y="27" fill="#efa16e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700">12 DAYS</text>

    <g transform="translate(28 70)">
      <circle cx="77" cy="77" r="61" fill="none" stroke="#41483d" stroke-width="14"/>
      <circle cx="77" cy="77" r="61" fill="none" stroke="#d88857" stroke-width="14" stroke-linecap="round" stroke-dasharray="251 383" transform="rotate(-90 77 77)"/>
      <circle cx="77" cy="77" r="43" fill="#20241e"/>
      <text x="77" y="75" fill="#f2ebdd" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" text-anchor="middle">66%</text>
      <text x="77" y="95" fill="#a6ad9f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" text-anchor="middle">READY</text>
      <text x="0" y="171" fill="#b7bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12.5">Operating Systems</text>
      <text x="0" y="190" fill="#8e9788" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">FINAL EXAM / SEP 14</text>
    </g>
    <g transform="translate(203 69)">
      <rect width="493" height="91" rx="11" fill="#1c201a" stroke="#555e4e"/>
      <text x="20" y="23" fill="#a8afa1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1.1">TODAY'S STUDY BLOCK</text>
      <text x="20" y="51" fill="#f1eadb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Memory management · Chapter 5</text>
      <text x="20" y="73" fill="#aab1a3" font-family="Arial, Helvetica, sans-serif" font-size="12">45 min focus session · 12 practice questions</text>
      <rect x="375" y="21" width="96" height="45" rx="8" fill="#365043"/>
      <text x="393" y="41" fill="#b7d1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">START</text>
      <text x="393" y="55" fill="#b7d1ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">HERE →</text>
    </g>
    <g transform="translate(203 177)">
      <text x="0" y="0" fill="#9fa79a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">PREPAREDNESS BY TOPIC</text>
      <g transform="translate(0 17)">
        <text x="0" y="12" fill="#c1c5bb" font-family="Arial, Helvetica, sans-serif" font-size="11.5">Processes</text><rect x="140" y="3" width="255" height="8" rx="4" fill="#42493e"/><rect x="140" y="3" width="204" height="8" rx="4" fill="#78997a"/><text x="409" y="12" fill="#aeb4a6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">80%</text>
        <text x="0" y="39" fill="#c1c5bb" font-family="Arial, Helvetica, sans-serif" font-size="11.5">Memory</text><rect x="140" y="30" width="255" height="8" rx="4" fill="#42493e"/><rect x="140" y="30" width="161" height="8" rx="4" fill="#d88857"/><text x="409" y="39" fill="#efa16e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">63%</text>
        <text x="0" y="66" fill="#c1c5bb" font-family="Arial, Helvetica, sans-serif" font-size="11.5">File systems</text><rect x="140" y="57" width="255" height="8" rx="4" fill="#42493e"/><rect x="140" y="57" width="104" height="8" rx="4" fill="#c69b58"/><text x="409" y="66" fill="#e3c17b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">41%</text>
      </g>
    </g>
  </g>
