        <text x="253" y="22.5" fill="#b6d4ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700">NEXT</text>
      </g>
      <g transform="translate(0 47)">
        <rect width="311" height="38" rx="8" fill="#222720" stroke="#535c4e"/>
        <rect width="4" height="38" rx="2" fill="#6e8db7"/>
        <text x="17" y="16" fill="#f0eadb" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">MTH201 · Problem set 2</text>
        <text x="17" y="30" fill="#9fa79a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">SEP 10  /  10 DAYS</text>
      </g>
      <g transform="translate(0 94)">
        <rect width="311" height="38" rx="8" fill="#222720" stroke="#535c4e"/>
        <rect width="4" height="38" rx="2" fill="#c69b58"/>
        <text x="17" y="16" fill="#f0eadb" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">DES102 · Critique</text>
        <text x="17" y="30" fill="#9fa79a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">SEP 17  /  17 DAYS</text>
      </g>
      <g transform="translate(330 0)">
