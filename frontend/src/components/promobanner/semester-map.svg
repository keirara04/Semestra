<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra semester map promotional banner</title>
  <desc id="desc">Dark academic banner showing a unified semester timeline and course milestones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151713"/>
      <stop offset="1" stop-color="#0c0e0b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a23"/>
      <stop offset="1" stop-color="#191c17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <g stroke="#f3ecda" stroke-opacity=".05" stroke-width="1">
    <path d="M0 45H1600M0 90H1600M0 135H1600M0 180H1600M0 225H1600M0 270H1600M0 315H1600"/>
    <path d="M75 0V360M150 0V360M225 0V360M300 0V360M375 0V360M450 0V360M525 0V360M600 0V360M675 0V360M750 0V360M825 0V360M900 0V360M975 0V360M1050 0V360M1125 0V360M1200 0V360M1275 0V360M1350 0V360M1425 0V360M1500 0V360"/>
  </g>
  <circle cx="1200" cy="188" r="184" fill="#78997a" fill-opacity=".07" filter="url(#glow)"/>
  <path d="M714 36V324" stroke="#d47745" stroke-opacity=".48"/>
  <path d="M746 36V324" stroke="#f3ecdd" stroke-opacity=".12"/>

  <text x="72" y="76" fill="#e58854" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2">SEMESTRA / SEMESTER VIEW</text>
  <text x="72" y="137" fill="#f4ecda" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="700">Your entire semester,</text>
  <text x="72" y="185" fill="#f4ecda" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="700">in one clear view.</text>
  <text x="72" y="231" fill="#b9bdaf" font-family="Arial, Helvetica, sans-serif" font-size="17">Courses, assessments, and key dates—</text>
  <text x="72" y="255" fill="#b9bdaf" font-family="Arial, Helvetica, sans-serif" font-size="17">mapped together without the mental tabs.</text>
  <g transform="translate(72 291)">
