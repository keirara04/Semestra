      <circle cx="151" cy="23" r="7" fill="#e48650"/><circle cx="259" cy="23" r="5" fill="#78997a"/><circle cx="367" cy="23" r="5" fill="#6e8db7"/><circle cx="475" cy="23" r="5" fill="#c69b58"/><circle cx="583" cy="23" r="5" fill="#9a7599"/>
