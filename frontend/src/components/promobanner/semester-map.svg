        <text x="18" y="25" fill="#a3aa9d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">SEMESTER PULSE</text>
        <text x="18" y="57" fill="#f2ebdd" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">8</text>
        <text x="51" y="56" fill="#b5baae" font-family="Arial, Helvetica, sans-serif" font-size="12">key dates ahead</text>
        <path d="M19 81H313" stroke="#4f574a"/>
        <g fill="#aeb5a6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><text x="18" y="108">4 COURSES</text><text x="129" y="108">12 TASKS</text><text x="233" y="108">2 EXAMS</text></g>
      </g>
