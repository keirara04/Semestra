    <text x="18" y="22" fill="#141512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" letter-spacing="1.3">OPEN SEMESTER</text>
    <path d="M162 12l8 5-8 5" fill="none" stroke="#141512" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(805 38)">
