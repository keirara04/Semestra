<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Semestra workload forecast promotional banner</title>
  <desc id="desc">Dark academic banner showing a weekly workload dashboard with daily capacity bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171914"/>
      <stop offset="1" stop-color="#0e100d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a22"/>
      <stop offset="1" stop-color="#1a1d18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef9c66"/>
      <stop offset="1" stop-color="#c85e35"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="360" fill="url(#bg)"/>
  <g stroke="#f4ecda" stroke-opacity=".055" stroke-width="1">
    <path d="M0 60H1600M0 120H1600M0 180H1600M0 240H1600M0 300H1600"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360M1200 0V360M1280 0V360M1360 0V360M1440 0V360M1520 0V360"/>
  </g>
  <circle cx="1216" cy="157" r="190" fill="#df7442" fill-opacity=".075" filter="url(#softGlow)"/>
  <path d="M713 36V324" stroke="#d47745" stroke-opacity=".48" stroke-width="1"/>
  <path d="M745 36V324" stroke="#f3ecdd" stroke-opacity=".12" stroke-width="1"/>

  <g fill="#e58854" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2">
    <text x="72" y="76">SEMESTRA / WEEKLY INTELLIGENCE</text>
  </g>
  <text x="72" y="137" fill="#f4ecda" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="700">See the week before</text>
  <text x="72" y="185" fill="#f4ecda" font-family="Georgia, Times New Roman, serif" font-size="46" font-weight="700">it fills up.</text>
  <text x="72" y="231" fill="#b9bdaf" font-family="Arial, Helvetica, sans-serif" font-size="17">Make capacity visible, move work early,</text>
  <text x="72" y="255" fill="#b9bdaf" font-family="Arial, Helvetica, sans-serif" font-size="17">and keep overloaded days from becoming surprises.</text>
  <g transform="translate(72 291)">
    <rect width="195" height="34" rx="17" fill="#e48650"/>
    <text x="18" y="22" fill="#141512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" letter-spacing="1.3">VIEW WORKLOAD</text>
    <path d="M169 12l8 5-8 5" fill="none" stroke="#141512" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(805 38)">
    <rect width="724" height="284" rx="18" fill="url(#panel)" stroke="#626956" stroke-opacity=".7"/>
    <rect x="1" y="1" width="722" height="45" rx="17" fill="#2d3229" fill-opacity=".78"/>
    <path d="M1 46H723" stroke="#676f5c" stroke-opacity=".6"/>
    <text x="28" y="29" fill="#f1eadb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.6">WEEK CAPACITY</text>
    <text x="635" y="29" fill="#e8915e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.2">WEEK 03</text>

    <g transform="translate(28 68)">
      <text x="0" y="10" fill="#aeb4a5" font-family="Arial, Helvetica, sans-serif" font-size="13">Planned study time</text>
      <text x="0" y="35" fill="#f2ebdd" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700">19h 45m</text>
      <text x="98" y="34" fill="#98c18e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">/ 28h free</text>
      <rect x="0" y="51" width="161" height="7" rx="3.5" fill="#4b5145"/>
      <rect x="0" y="51" width="113" height="7" rx="3.5" fill="#88a77a"/>
    </g>
    <g transform="translate(246 68)">
      <rect width="444" height="66" rx="9" fill="#1b1f19" stroke="#505746" stroke-opacity=".85"/>
      <text x="18" y="22" fill="#abb2a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.3">ONE DAY NEEDS ATTENTION</text>
      <text x="18" y="47" fill="#f2ebdd" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Wed · 8h 10m planned</text>
      <rect x="320" y="18" width="102" height="29" rx="14.5" fill="#5a2b22"/>
      <text x="337" y="37" fill="#f1a070" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">OVERLOAD</text>
    </g>

    <g transform="translate(28 159)">
      <g fill="#8f9688" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">
        <text x="34" y="102">MON</text><text x="101" y="102">TUE</text><text x="168" y="102">WED</text><text x="235" y="102">THU</text><text x="302" y="102">FRI</text><text x="369" y="102">SAT</text><text x="436" y="102">SUN</text>
      </g>
      <g fill="#30362d"><rect x="16" y="18" width="36" height="70" rx="5"/><rect x="83" y="18" width="36" height="70" rx="5"/><rect x="150" y="18" width="36" height="70" rx="5"/><rect x="217" y="18" width="36" height="70" rx="5"/><rect x="284" y="18" width="36" height="70" rx="5"/><rect x="351" y="18" width="36" height="70" rx="5"/><rect x="418" y="18" width="36" height="70" rx="5"/></g>
      <g>
        <rect x="16" y="53" width="36" height="35" rx="5" fill="#78997a"/>
        <rect x="83" y="41" width="36" height="47" rx="5" fill="#78997a"/>
        <rect x="150" y="18" width="36" height="70" rx="5" fill="url(#bar)"/>
        <rect x="217" y="48" width="36" height="40" rx="5" fill="#78997a"/>
        <rect x="284" y="63" width="36" height="25" rx="5" fill="#78997a"/>
        <rect x="351" y="68" width="36" height="20" rx="5" fill="#6c8ab2"/>
        <rect x="418" y="73" width="36" height="15" rx="5" fill="#6c8ab2"/>
      </g>
      <g fill="#f2ebdd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="middle">
        <text x="34" y="45">42%</text><text x="101" y="33">61%</text><text x="168" y="12" fill="#f0a06b">116%</text><text x="235" y="40">55%</text><text x="302" y="55">31%</text><text x="369" y="60">24%</text><text x="436" y="65">18%</text>
      </g>
    </g>
    <g transform="translate(523 178)">
      <rect width="167" height="68" rx="10" fill="#242922" stroke="#596151"/>
      <text x="16" y="22" fill="#aab1a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1.1">SUGGESTED SHIFT</text>
      <text x="16" y="45" fill="#f1eadb" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">Move 1h 30m</text>
      <text x="16" y="61" fill="#9fb997" font-family="Arial, Helvetica, sans-serif" font-size="12">Wed → Tue</text>
      <circle cx="147" cy="34" r="12" fill="#78997a"/>
      <path d="M141 34l4 4 7-8" fill="none" stroke="#10120f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
